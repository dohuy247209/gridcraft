name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Tự động chạy vào 00:00 mỗi ngày (giờ UTC)
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "storytold/gridcraft"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}
